# Nginx reverse proxy config for the Dostra CRM stack (production).
#
# This sits in front of both containers and is the only service that exposes
# a port to the outside world. It routes traffic based on path:
#
#   /api  /sanctum  /admin  /livewire-*  /filament  /up
#                            →  FastCGI to the api container (PHP-FPM on 9000)
#   /{css,js,fonts}/filament →  static Filament assets, served from this container
#   everything else          →  proxy to the web container (Nginx on 80)
#
# SSL termination should be handled here (or by an upstream load balancer).
# The SSL section below is commented out — uncomment and populate with your
# certificate paths when you add TLS.

server {
    listen 80;
    server_name _;

    # Re-resolve api/web through Docker's DNS instead of once at startup.
    # Otherwise, when a container is recreated on deploy and gets a new IP,
    # Nginx keeps the old one and returns 502 until it is restarted.
    # Using variables in fastcgi_pass / proxy_pass is what makes Nginx honour this.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:9000;
    set $web_upstream web:80;

    # ── Laravel routes ─────────────────────────────────────────────────────────
    # Laravel's public entry point is /var/www/html/public/index.php inside the
    # api container. All of these requests are routed through that single file:
    #   api, sanctum   REST API and Sanctum CSRF cookie
    #   admin          Filament admin panel
    #   livewire-*     Livewire update endpoint and JS (path includes a hash)
    #   filament       Filament export/import downloads
    #   up             health check

    location ~ ^/(api|sanctum|admin|filament|up|livewire[^/]*)(/|$) {
        root /var/www/html/public;

        # Pass the request to PHP-FPM running in the api container.
        fastcgi_pass $api_upstream;
        fastcgi_index index.php;

        # Tell PHP-FPM which script to execute. Every Laravel request goes
        # through public/index.php regardless of the URL path.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        include fastcgi_params;

        # Tell Laravel the real client IP and scheme (it only sees this Nginx
        # container otherwise). Set from Nginx's own view, never copied from
        # request headers, so clients can't spoof them. Laravel trusts these
        # because bootstrap/app.php calls trustProxies(at: '*') and PHP-FPM is
        # only reachable from this container.
        # If TLS is terminated by an upstream load balancer instead, forward
        # its X-Forwarded-Proto here and trust only that balancer.
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $server_port;
    }

    # ── Filament static assets ─────────────────────────────────────────────────
    # Copied into this image from the api image (see nginx/Dockerfile).

    location ~ ^/(css|js|fonts)/filament/ {
        root /var/www/html/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Frontend ───────────────────────────────────────────────────────────────
    # All other traffic is forwarded to the web container which serves the
    # pre-built Vite static assets via its own Nginx instance.

    location / {
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

